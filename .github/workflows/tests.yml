name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Generators run cleanly on a fresh machine
        run: |
          python scripts/generate_static.py --out "$RUNNER_TEMP/assets"
          python scripts/generate_portrait.py --out "$RUNNER_TEMP/assets"
          python scripts/generate_coin.py --contributions 1234 --frames 4 --out "$RUNNER_TEMP/coin"
          ls -la "$RUNNER_TEMP/assets" "$RUNNER_TEMP/coin"
