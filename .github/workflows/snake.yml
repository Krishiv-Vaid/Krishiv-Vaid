# Daily: render the contribution graph being eaten by a snake, push the SVGs
# to the orphan `output` branch. The README loads them from there.
name: snake

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8F5BFF&color_dots=#ebedf0,#c6f6ff,#7fe9ff,#b49bff,#ff3cac
            dist/snake-dark.svg?palette=github-dark&color_snake=#00E5FF&color_dots=#161b22,#1d2b4a,#3b3f8f,#8f5bff,#ff3cac

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
