name: update profile

on:
  schedule:
    - cron: "23 6 * * *" # daily, 06:23 UTC (off the top of the hour to avoid queue spikes)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profilegen/**"
      - "scripts/**"
      - "config.toml"
      - "requirements.txt"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch currently published assets
        run: |
          mkdir -p previous
          if git fetch --depth=1 origin output 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C previous
          fi
          ls -la previous

      - name: Collect GitHub data
        env:
          # PROFILE_TOKEN (optional, read-only PAT) sees the same numbers the
          # profile shows; GITHUB_TOKEN works for all public metrics.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/collect_github.py --out out/snapshot.json --cache previous/snapshot.json

      - name: Render koi pond (reused when inputs are unchanged)
        run: python scripts/generate_koi.py --snapshot out/snapshot.json --out out --reuse previous

      - name: Render stats panel
        run: python scripts/generate_stats.py --snapshot out/snapshot.json --koi out/koi.json --out out

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("out/snapshot.json")); k = json.load(open("out/koi.json"))
          print(f"**{k['stage']} koi**, {k['length_px']} px · {s['contributions']} contributions / {s['window_days']} d"
                f" · stale={s['stale']}")
          print()
          print("| file | bytes |\n|--|--|")
          import os
          for f in sorted(os.listdir("out")):
              print(f"| {f} | {os.path.getsize(os.path.join('out', f)):,} |")
          PY

      - name: Publish changed assets to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish_output.sh out previous output
