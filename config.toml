# Inputs for the generated, data-driven assets (koi pond + stats panel).
# Static assets (portrait, project cards, toolkit) are configured in code.

[github]
login = "Krishiv-Vaid"
# Rolling window for contribution metrics, in days (GitHub caps a single
# contributionsCollection query at one year).
window_days = 365
# Repositories whose activity is excluded from koi/stats inputs. The profile
# repository is excluded because its history is mostly asset regeneration.
exclude_repos = ["Krishiv-Vaid/Krishiv-Vaid"]
# Markup / notebook languages are excluded from "programming language" metrics.
exclude_languages = ["HTML", "CSS", "SCSS", "Jupyter Notebook", "TeX", "Makefile", "Dockerfile"]
# Languages below this share are folded into "other" on the lily pads.
min_language_share = 0.03

[koi]
# Pond is drawn at 224x112 native pixels and upscaled by an integer factor.
scale = 4
gif_scale = 3
frames = 300
frame_ms = 80
